# nginx site for the diyeh API — separate from every other site on this server.
#
# Install:
#   sudo cp nginx_api.vakilrobot.ir.conf /etc/nginx/sites-available/api.vakilrobot.ir
#   sudo ln -s /etc/nginx/sites-available/api.vakilrobot.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then get HTTPS (certbot edits only this file):
#   sudo certbot --nginx -d api.vakilrobot.ir
#
# If you changed the service port from 8105, change it below too.

# At most 5 requests/second per IP (bursts of 20 allowed).
limit_req_zone $binary_remote_addr zone=diyeh_api:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.vakilrobot.ir;

    access_log /var/log/nginx/api.vakilrobot.ir.access.log;
    error_log  /var/log/nginx/api.vakilrobot.ir.error.log;

    location = /api/v1/diyeh-rates {
        limit_except GET HEAD { deny all; }
        limit_req zone=diyeh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8105;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/health {
        limit_req zone=diyeh_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8105;
        proxy_set_header Host $host;
    }

    # Nothing else is served on this subdomain.
    location / {
        return 404;
    }
}
